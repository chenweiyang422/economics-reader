<svg xmlns="http://www.w3.org/2000/svg" width="920" height="650" viewBox="0 0 920 650" role="img" data-redraw="semantic"><title>图29-1 美国货币存量（2016年1月）</title><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 0)"><text x="460.00" y="35.00" font-size="24" fill="#414958" text-anchor="middle">美国货币存量（2016 年 1 月）</text><path d="M100.00,80.00L100.00,550.00" fill="none" stroke="#414958" stroke-width="2"/><path d="M100.00,550.00L830.00,550.00" fill="none" stroke="#414958" stroke-width="2"/><rect x="190.00" y="430.00" width="230.00" height="120.00" fill="#dcebf5" stroke="#414958"/><rect x="540.00" y="430.00" width="260.00" height="120.00" fill="#dcebf5" stroke="#414958"/><rect x="540.00" y="85.00" width="260.00" height="345.00" fill="#d8eade" stroke="#414958"/><text x="305.00" y="400.00" font-size="21" fill="#414958" text-anchor="middle">M₁：3202 亿美元</text><text x="670.00" y="67.00" font-size="21" fill="#414958" text-anchor="middle">M₂：12467 亿美元</text><text x="305.00" y="464.00" font-size="18" fill="#414958" text-anchor="middle">通货、旅行支票</text><text x="305.00" y="489.20" font-size="18" fill="#414958" text-anchor="middle">活期存款</text><text x="305.00" y="514.40" font-size="18" fill="#414958" text-anchor="middle">其他支票存款</text><text x="670.00" y="220.00" font-size="20" fill="#414958" text-anchor="middle">M₁ + 储蓄存款</text><text x="670.00" y="248.00" font-size="20" fill="#414958" text-anchor="middle">小额定期存款</text><text x="670.00" y="276.00" font-size="20" fill="#414958" text-anchor="middle">货币市场共同基金</text><text x="670.00" y="304.00" font-size="20" fill="#414958" text-anchor="middle">其他项目</text><text x="670.00" y="485.00" font-size="18" fill="#414958" text-anchor="middle">M₁ 中的所有资产</text><text x="460.00" y="615.00" font-size="21" fill="#414958" text-anchor="middle">M₂ 包含 M₁；图中数值沿用原书。</text></g></g></svg>