<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1000" viewBox="0 0 1040 1000" role="img" aria-labelledby="title desc"><title id="title">图7-1 需求表和需求曲线</title><desc id="desc">Taylor、Carrie、Rihanna、Gaga的支付意愿分别为100、80、70、50美元。需求曲线按这四个价格逐级下降，对应1、2、3、4张专辑。</desc><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><rect x="50" y="28" width="940" height="328" rx="10" fill="#f5eadc" stroke="#cdbbA5"/><text x="85" y="72" font-size="24" fill="#544b40" text-anchor="start">价格（美元）</text><text x="340" y="72" font-size="24" fill="#544b40" text-anchor="start">买者</text><text x="900" y="72" font-size="24" fill="#544b40" text-anchor="middle">需求量（张）</text><path d="M70 91L970 91" fill="none" stroke="#a29889" stroke-width="1.5"/><text x="85" y="128" font-size="23" fill="#544b40" text-anchor="start">100以上</text><text x="340" y="128" font-size="22" fill="#544b40" text-anchor="start">无</text><text x="900" y="128" font-size="23" fill="#544b40" text-anchor="middle">0</text><path d="M70 147L970 147" fill="none" stroke="#dfd3c2" stroke-width="1"/><text x="85" y="177" font-size="23" fill="#544b40" text-anchor="start">80—100</text><text x="340" y="177" font-size="22" fill="#544b40" text-anchor="start">Taylor</text><text x="900" y="177" font-size="23" fill="#544b40" text-anchor="middle">1</text><path d="M70 196L970 196" fill="none" stroke="#dfd3c2" stroke-width="1"/><text x="85" y="226" font-size="23" fill="#544b40" text-anchor="start">70—80</text><text x="340" y="226" font-size="22" fill="#544b40" text-anchor="start">Taylor，Carrie</text><text x="900" y="226" font-size="23" fill="#544b40" text-anchor="middle">2</text><path d="M70 245L970 245" fill="none" stroke="#dfd3c2" stroke-width="1"/><text x="85" y="275" font-size="23" fill="#544b40" text-anchor="start">50—70</text><text x="340" y="275" font-size="22" fill="#544b40" text-anchor="start">Taylor，Carrie，Rihanna</text><text x="900" y="275" font-size="23" fill="#544b40" text-anchor="middle">3</text><path d="M70 294L970 294" fill="none" stroke="#dfd3c2" stroke-width="1"/><text x="85" y="324" font-size="23" fill="#544b40" text-anchor="start">50或以下</text><text x="340" y="324" font-size="22" fill="#544b40" text-anchor="start">Taylor，Carrie，Rihanna，Gaga</text><text x="900" y="324" font-size="23" fill="#544b40" text-anchor="middle">4</text><path d="M150 425L150 920" fill="none" stroke="#544b40" stroke-width="2.5"/><path d="M150 920L950 920" fill="none" stroke="#544b40" stroke-width="2.5"/><text x="150" y="401" font-size="24" fill="#544b40" text-anchor="start">专辑的价格（美元）</text><text x="950" y="963" font-size="24" fill="#544b40" text-anchor="end">专辑的数量（张）</text><text x="135" y="946" font-size="20" fill="#544b40" text-anchor="end">0</text><path d="M150 705.0L158 705.0" fill="none" stroke="#544b40" stroke-width="2"/><text x="137" y="712.0" font-size="20" fill="#544b40" text-anchor="end">50</text><path d="M150 619.0L158 619.0" fill="none" stroke="#544b40" stroke-width="2"/><text x="137" y="626.0" font-size="20" fill="#544b40" text-anchor="end">70</text><path d="M150 576.0L158 576.0" fill="none" stroke="#544b40" stroke-width="2"/><text x="137" y="583.0" font-size="20" fill="#544b40" text-anchor="end">80</text><path d="M150 490.0L158 490.0" fill="none" stroke="#544b40" stroke-width="2"/><text x="137" y="497.0" font-size="20" fill="#544b40" text-anchor="end">100</text><path d="M280 920L280 912" fill="none" stroke="#544b40" stroke-width="2"/><text x="280" y="949" font-size="20" fill="#544b40" text-anchor="middle">1</text><path d="M410 920L410 912" fill="none" stroke="#544b40" stroke-width="2"/><text x="410" y="949" font-size="20" fill="#544b40" text-anchor="middle">2</text><path d="M540 920L540 912" fill="none" stroke="#544b40" stroke-width="2"/><text x="540" y="949" font-size="20" fill="#544b40" text-anchor="middle">3</text><path d="M670 920L670 912" fill="none" stroke="#544b40" stroke-width="2"/><text x="670" y="949" font-size="20" fill="#544b40" text-anchor="middle">4</text><path data-c