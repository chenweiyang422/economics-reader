<svg xmlns="http://www.w3.org/2000/svg" width="920" height="700" viewBox="0 0 920 700" role="img" data-redraw="semantic"><title>图28-1 2016年1月人口的分类</title><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 0)"><text x="460.00" y="38.00" font-size="24" fill="#414958" text-anchor="middle">2016 年 1 月人口的分类</text><rect x="270.00" y="90.00" width="370.00" height="301.00" fill="#dcebf5" stroke="#414958"/><text x="455.00" y="247.50" font-size="19" fill="#414958" text-anchor="middle">就业者：1.505 亿人</text><rect x="270.00" y="391.00" width="370.00" height="15.60" fill="#eee0c5" stroke="#414958"/><text x="655.00" y="405.80" font-size="19" fill="#414958" text-anchor="start">失业者：0.078 亿人</text><rect x="270.00" y="406.60" width="370.00" height="188.20" fill="#d8eade" stroke="#414958"/><text x="455.00" y="507.70" font-size="19" fill="#414958" text-anchor="middle">非劳动力：0.941 亿人</text><text x="230.00" y="335.00" font-size="20" fill="#414958" text-anchor="end">成年人口</text><text x="230.00" y="363.00" font-size="20" fill="#414958" text-anchor="end">2.524 亿人</text><text x="675.00" y="240.00" font-size="20" fill="#414958" text-anchor="start">劳动力</text><text x="675.00" y="268.00" font-size="20" fill="#414958" text-anchor="start">1.583 亿人</text><text x="460.00" y="660.00" font-size="22" fill="#414958" text-anchor="middle">劳动力 = 就业者 + 失业者</text></g></g></svg>