<svg xmlns="http://www.w3.org/2000/svg" width="920" height="190" viewBox="0 0 920 190" role="img" data-redraw="semantic"><title> 斜率=AY =第一个点的y坐标-第三个点的2坐标</title><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 0)"><text x="460.00" y="70.00" font-size="23" fill="#414958" text-anchor="middle">斜率 = Δy / Δx =（第一个点的 y − 第二个点的 y）</text><text x="460.00" y="112.00" font-size="23" fill="#414958" text-anchor="middle">÷（第一个点的 x − 第二个点的 x）</text><text x="460.00" y="156.00" font-size="25" fill="#287ac8" text-anchor="middle">= (6 − 8) / (21 − 13) = −1/4</text></g></g></svg>