<title id="title">图15-1 规模经济是垄断产生的一个原因</title>
<desc id="desc">纵轴为成本，横轴为产量。平均总成本曲线持续下降并逐渐变平，说明单个企业可以以最低成本生产任何既定数量的产品。此图为无数值刻度的原理示意图。</desc>
